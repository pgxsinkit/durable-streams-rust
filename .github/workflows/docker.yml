# Build the server image and publish it to the GitHub Container Registry.
#
#   ghcr.io/pgxsinkit/durable-streams-rust
#
# Pushes to main publish `main` + `sha-…` tags; version tags (v*) publish semver
# tags; pull requests build without pushing. Same shape as the docker workflow in
# pgxsinkit/electric-circuits, so both services are pinned by sha tag the same way.
#
# This is the reason the fork exists. Upstream published to Docker Hub
# `electricax/durable-streams-server-rust` from electric-sql/electric's CI, under
# namespaces belonging to a company that was acquired; there was no second
# publisher. See PROVENANCE.md.
#
# Upstream's image was multi-arch (amd64 + arm64), built natively per arch on
# their runners. This builds amd64 only, matching electric-circuits. If an arm64
# node ever needs it, add `platforms: linux/amd64,linux/arm64` below — but note
# QEMU-emulated arm64 Rust builds are slow, which is why upstream built natively
# rather than emulating.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=durable-streams-rust
          cache-to: type=gha,mode=max,scope=durable-streams-rust
